<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accordion example</title>
  <link rel="stylesheet" href="../../css/components.css">
  <style>body { font-family: system-ui, sans-serif; line-height: 1.5; margin: 0; padding: 32px 16px; color: #222; } main { max-width: 1100px; margin: 0 auto; } </style>
</head>
<body>
<main>
<h1>Accordion</h1>
<div class="ui-accordion">
  <details>
    <summary>Who can join?</summary>
    <div class="ui-accordion__panel">
      <p>Anyone with a connection to the organization is welcome to apply.</p>
    </div>
  </details>
  <details>
    <summary>What does membership include?</summary>
    <div class="ui-accordion__panel">
      <p>Members get access to events, reservations and shared spaces. <a href="#details">See full details</a>.</p>
    </div>
  </details>
  <details>
    <summary>How do I contact you?</summary>
    <div class="ui-accordion__panel">
      <p>Email <a href="mailto:info@example.com">info@example.com</a> or visit us in person.</p>
    </div>
  </details>
</div>
</main>
</body>
</html>
